
<!DOCTYPE html>
<html>
<head>
    <title>Kasir Kantin Sekolah</title>
</head>
<body>

    <h1>Program Pembayaran Kantin</h1>

    <div id="hasil"></div>

    <button onclick="window.print()">
        Print PDF
    </button>

    <script>
        // Data pembeli
        let namaPembeli = "Budi";

        // Harga barang
        let hargaNasiGoreng = 15000;
        let hargaEsTeh = 5000;
        let hargaRoti = 7000;

        // Jumlah barang
        let jumlahNasiGoreng = 2;
        let jumlahEsTeh = 1;
        let jumlahRoti = 2;

        // Menghitung subtotal
        let subtotalNasiGoreng =
            hargaNasiGoreng * jumlahNasiGoreng;

        let subtotalEsTeh =
            hargaEsTeh * jumlahEsTeh;

        let subtotalRoti =
            hargaRoti * jumlahRoti;

        // Menghitung total belanja
        let totalBelanja =
            subtotalNasiGoreng +
            subtotalEsTeh +
            subtotalRoti;

        // Menghitung diskon
        let diskon = 0;

        if (totalBelanja >= 50000) {
            diskon = totalBelanja * 10 / 100;
        }

        // Menghitung total pembayaran
        let totalBayar = totalBelanja - diskon;

        // Format rupiah
        let formatRupiah = function(angka) {
            return "Rp" + angka.toLocaleString("id-ID");
        };

        // Menampilkan hasil di console
        console.log("Pembeli: " + namaPembeli);
        console.log("Total Belanja: " +
            formatRupiah(totalBelanja));
        console.log("Diskon: " + formatRupiah(diskon));
        console.log("Total Bayar: " +
            formatRupiah(totalBayar));

        // Menampilkan hasil di halaman web
        document.getElementById("hasil").innerHTML =
            "Pembeli: " + namaPembeli + "<br>" +
            "Total Belanja: " +
            formatRupiah(totalBelanja) + "<br>" +
            "Diskon: " + formatRupiah(diskon) + "<br>" +
            "Total Bayar: " + formatRupiah(totalBayar);
    </script>

</body>
</html>
