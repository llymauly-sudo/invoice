
<!DOCTYPE html>
<html>
<head>
    <title>Program Kasir Kantin</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        button {
            background-color: green;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        @media print {
            button {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Kantin Sekolah</h1>

        <div id="hasil"></div>

        <button onclick="window.print()">
            Print / Simpan PDF
        </button>
    </div>

    <script src="script.js"></script>

</body>
</html>
